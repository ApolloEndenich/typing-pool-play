  and a page"). spinoff/bonus/ is the text, read cold twice; this page is that
  text, with the board drawn and stepped instead of read as a table. Every
  time, jack, cord and word here is the generated episode's (switchboard seed
  16); the answers are spinoff/out/packet-switchboard-seed16-answer.md.

  SEVEN LANGUAGES, ONE PAGE (the user, 3 November 2026: "single page with
  table"). TEXT below holds every word of the page per language; the board,
  the answers and the plugs are shared. The language is ?lang= (app.js passes
  it), else the site's `pool.lang`, else the browser's.

  THE CROSSING IS FOUND BY THE WORDS, so each language says each call's
  question, yes and stop ONCE, in W, and both ends of a call quote W: the
  desk's note and the far end's book cannot drift apart in any language.

/* ------------------------------------------------------- which language */
function pickLanguage() {
  let v = null;
  try { v = new URLSearchParams(location.search).get("lang"); } catch (e) {}
  if (TEXT[v]) { try { localStorage.setItem("pool.lang", v); } catch (e) {} return v; }
  try { v = localStorage.getItem("pool.lang"); } catch (e) { v = null; }
  if (TEXT[v]) return v;
  try {
    for (const w of navigator.languages || [navigator.language || "en"]) {
      const s = String(w).toLowerCase().split("-")[0];
      if (TEXT[s]) return s;
    }
  } catch (e) {}
  return "en";
}

function stateAt(k) {
  const s = {};

    const [, cord, move, jack] = TICKS[i];
    if (move === "in") (s[cord] = s[cord] || []).push(jack); else delete s[cord];

}
function describe(k) {
  const [t, cord, move, jack] = TICKS[k];
  const had = stateAt(k)[cord] || [];
  if (move === "out") return [t, had.length > 1 ? T.mv.both(cord) : T.mv.again(cord)];
  return [t, had.length ? T.mv.other(cord, jack) : T.mv.one(cord, jack)];
}
const COLOURS = {1: "#8A2B2B", 2: "#1E6B2F", 3: "#2B4F8A", 4: "#8A6A1E"};
function drawBoard(n) {

  for (const j of JACKS) {

    g += `<circle cx="${x(j)}" cy="${y}" r="10" fill="var(--wash)" stroke="var(--ink)" stroke-width="2"/>`;
    g += `<text x="${x(j)}" y="100" text-anchor="middle" font-size="10" fill="var(--faint)">${T.short[j] || T.short.out}</text>`;
  }

    if (!plugs.length) {

      g += `<path d="M ${px} ${y + 10} C ${px} 160, ${rest + 40} 170, ${rest + 40} 200" fill="none" stroke="${col}" stroke-width="4"/>`;

    } else {

      g += `<path d="M ${a} ${y + 10} Q ${mid} ${y + sag} ${b} ${y + 10}" fill="none" stroke="${col}" stroke-width="4"/>`;

slider.oninput = () => drawBoard(+slider.value);
$("prev").onclick = () => { slider.value = Math.max(0, +slider.value - 1); drawBoard(+slider.value); };
$("next").onclick = () => { slider.value = Math.min(TICKS.length, +slider.value + 1); drawBoard(+slider.value); };
set("ticks", `<tr><th></th><th>${T.th[0]}</th><th>${T.th[1]}</th></tr>` +
  TICKS.map((_, k) => { const [t, w] = describe(k); return `<tr><td>${k + 1}</td><td>${t}</td><td>${w}</td></tr>`; }).join(""));
drawBoard(0);

/* ------------------------------------------------------------ the papers */
const P = ([title, body]) => `<div class="paper"><b>${title}</b>${body}</div>`;
set("papers0", T.papers0.map(P).join(""));

/* ------------------------------------------------------------ the report */
const OPTIONS = [[T.parties, T.parties, T.parties, T.parties], [T.people, T.falsePapers], [T.yesno, T.yesno]];

/* what this browser has signed: kept with the browser, and forgiven if it
   cannot be. The answers are indices, the same in every language. */
const KEY = "bonus.exchange";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
const save = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
let STATE = load();
const held = i => !!(STATE.held || {})[i];

function drawParts() {
  const box = $("parts");
  box.innerHTML = "";
  T.parts.forEach((part, i) => {
    const open = i === 0 || held(i - 1);
    const d = document.createElement("section");
    d.className = "report" + (open ? "" : " locked");
    let h = `<h3>${part.title}</h3>`;
    if (!open) { d.innerHTML = h + `<p class="faint">${T.locked}</p>`; box.appendChild(d); return; }
    if (part.papers.length) h += `<p class="faint">${T.withPart}</p>` + part.papers.map(P).join("");
    else h += `<p class="faint">${T.noMore}</p>`;
    const picked = (STATE.picked || {})[i] || [];
    part.blanks.forEach((q, b) => {
      h += `<label for="b${i}_${b}">${q}</label><select id="b${i}_${b}"${held(i) ? " disabled" : ""}>` +
        `<option value="">…</option>` + OPTIONS[i][b].map((o, k) =>
          `<option value="${k}"${String(picked[b]) === String(k) ? " selected" : ""}>${o}</option>`).join("") + `</select>`;
    });
    if (part.sentence) h += `<label for="s${i}">${part.sentence}</label><textarea id="s${i}">${
      (STATE.sentence || "").replace(/</g, "&lt;")}</textarea>`;
    h += held(i) ? `<div class="verdict ok">${T.holds}</div>` +
                   (part.file ? `<p><b>${T.forFile}</b> ${part.file}</p>` : "")
                 : `<button data-part="${i}">${T.sign}</button><div class="verdict" id="v${i}"></div>`;
    d.innerHTML = h;
    box.appendChild(d);
  });
  box.querySelectorAll("button[data-part]").forEach(b => b.onclick = () => sign(+b.dataset.part));
  $("card").hidden = !held(T.parts.length - 1);
}
function sign(i) {
  const part = T.parts[i];
  const got = part.blanks.map((_, b) => $(`b${i}_${b}`).value);
  STATE.picked = Object.assign({}, STATE.picked, {[i]: got});
  if (part.sentence) STATE.sentence = $(`s${i}`).value;
  const v = $(`v${i}`);
  const no = msg => { v.className = "verdict no"; v.textContent = msg; save(STATE); };
  if (got.some(x => x === "")) return no(T.needAll);
  if (part.sentence && !(STATE.sentence || "").trim()) return no(T.needSentence);
  if (!ANSWERS[i].every((a, b) => +got[b] === a)) return no(T.notYet);
  STATE.held = Object.assign({}, STATE.held, {[i]: true});
  save(STATE);
  drawParts();
}
$("reset").onclick = () => {
  if (confirm(T.confirm)) { STATE = {}; save(STATE); drawParts(); }
};
drawParts();
</script>
</body>
</html>
