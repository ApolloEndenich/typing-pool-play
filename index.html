/* The same setting as every other page on the site (pool.lang), so a reader
   who chose German here gets German in the Typing Pool, the story and Pier 7. */
function recall(){
 try { const v = localStorage.getItem("pool.lang"); if (v) return v; } catch (e) {}
 try {
  for (const w of (navigator.languages || [navigator.language || "en"])){
   const s = String(w).toLowerCase().split("-")[0];
   if (s) return s;
  }
 } catch (e) {}
 return "en";
}
let L = recall();
function lang(){ return W[L] ? L : "en"; }   // the Typing Pool's two Englishes read as en here

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function draw(){
 const l = lang(), t = W[l];
 document.documentElement.lang = l;
 $("sub").textContent = t.sub;
 $("games").innerHTML = GAMES.map(g => {
  const [kind, text] = t.games[g.id];
  return `<article class="game">`
   + `<a class="pic" href="${g.href}" tabindex="-1" aria-hidden="true"><img src="games/${g.id}.jpg" alt="" width="630" height="500"></a>`
   + `<div class="body">`
   + `<h2><a href="${g.href}">${esc(g.title)}</a></h2>`
   + `<div class="kind">${esc(kind)}</div>`
   + `<p>${esc(text)}</p>`
   + `<div class="row"><a class="play" href="${g.href}">${esc(t.play)} →</a>`
   + `<span class="langs">${esc(g.all ? t.allLangs : t.english)}</span></div>`
   + `</div></article>`;
 }).join("");
 $("more").innerHTML = t.more;
 $("foot").innerHTML = esc(t.foot)
  + ` &nbsp;·&nbsp; <a href="https://github.com/ApolloEndenich/typing-pool-play/issues" target="_blank" rel="noopener">${esc(t.report)}</a>`
  + ` &nbsp;·&nbsp; <a href="mailto:typingpool1969@gmail.com">typingpool1969@gmail.com</a>`;
 const sel = document.createElement("select");
 sel.className = "langpick";
 sel.setAttribute("aria-label", "Language");
 for (const k of Object.keys(W)){
  const o = document.createElement("option");
  o.value = k; o.textContent = W[k].name; if (k === l) o.selected = true;
  sel.appendChild(o);
 }
 sel.onchange = () => {
  L = sel.value;
  try { localStorage.setItem("pool.lang", L); } catch (e) {}
  draw();
 };
 $("langwrap").innerHTML = "";
 $("langwrap").appendChild(sel);
}
draw();
</script>
