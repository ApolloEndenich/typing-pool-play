<script>
"use strict";
/* The language machinery, shared by every page. Baked into all of them.

   The prose itself is elsewhere — `strings.js` for the front and books pages,
   `sheet-strings.js` for the sheet, `phrase.js` for the clues. This file is
   only the parts all three need: which language is chosen, where that is
   remembered, how a date is formatted, and the picker.

   `pool.lang` is one setting for the whole site, so choosing on the front
   page carries into the sheet. A page that cannot offer the chosen language
   falls back to English for ITSELF without changing the setting — the sheet
   knows two languages while the front page knows six, and a reader who chose
   French keeps French on the pages that have it. */

/* TODAY, AS THE VIEWER'S OWN CALENDAR HAS IT.

   Every page that says "today" has to ask the browser, not the build. A date
   baked in at build time is right for one day and wrong until somebody runs
   a script, which is not what a daily is.

   `toISOString()` is UTC and would hand a reader in Toronto yesterday's
   puzzle all evening, so the parts come off the LOCAL date instead. */
function todayISO(d){
 d = d || new Date();
 const p = n => String(n).padStart(2, "0");
 return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

/* Monday 0 through Sunday 6, which is how daily.py's WEEK is indexed and
   therefore how the notes in strings.js are ordered. JavaScript starts its
   week on Sunday; the roster does not. Noon, so that no timezone shift can
   move the date across midnight on the way through Date(). */
function weekdayIndex(iso){
 return (new Date(iso + "T12:00:00").getDay() + 6) % 7;
}

let UILANG = "en";

function uiRecall(){
 try { const v = localStorage.getItem("pool.lang"); if (v) return v; } catch (e) {}
 /* Failing that, whatever the browser asks for. Both of these are wrapped
    because neither is guaranteed: `localStorage` throws outright in a private
    window or with site data blocked, and `navigator` is simply absent under
    the test harness. A page that cannot read a preference should open in
    English, not fail to open. */
 try {
  const want = navigator.languages || [navigator.language || "en"];
  for (const w of want){
   const short = String(w).toLowerCase().split("-")[0];
   if (short) return short;
  }
 } catch (e) {}
 return "en";
}

function uiSet(l){
 UILANG = l || "en";
 try { localStorage.setItem("pool.lang", UILANG); } catch (e) {}
 return UILANG;
}

/* "{n} lessons" with the number in it. Deliberately dumb: no plural rules and
   no gender. Anything needing those gets a whole sentence of its own in the
   table instead, which is the only way a translator can actually fix it. */
function fill(s, vals){
 return String(s).replace(/\{(\w+)\}/g, (m, k) => (k in vals ? vals[k] : m));
}

/* A date in the reader's language. Pages used to be handed a string Python
   had already formatted in English — "Saturday, 06 September 2026" — which no
   table can translate. They get the ISO date and format it here. */
function uiDate(iso, locale, opts){
 try {
  return new Intl.DateTimeFormat(locale || "en-GB",
    opts || {year: "numeric", month: "long", day: "numeric"})
    .format(new Date(iso + "T12:00:00"));
 } catch (e) { return iso; }
}

/* One <select>, because it has to work on a phone with no network and because
   a row of flags would be claiming that a language belongs to a country. Each
   language is named in itself: somebody looking for their own is not reading
   the one currently on screen.

   `langs` is what THIS page can offer, which is not always all of them. */
function langPicker(langs, nameOf, current, onChange, label){
 const sel = document.createElement("select");
 sel.className = "langpick";
 if (label) sel.setAttribute("aria-label", label);
 sel.innerHTML = langs.map(l =>
   `<option value="${l}"${l === current ? " selected" : ""}>${nameOf(l)}<\/option>`).join("");
 sel.onchange = () => { uiSet(sel.value); onChange(); };
 return sel;
}

/* The prose of the static pages, one table per language.
   `build_start.py` bakes this into index.html and books.html at `__STRINGS__`.

   HOW THIS DIFFERS FROM phrase.js, AND WHY THEY ARE TWO FILES

   `phrase.js` renders CLUES. A clue is load-bearing: "two floors above" and
   "two floors below" are different puzzles, so that file is guarded by
   `phrase-test.js`, which holds English against the Python reference and
   checks in every language that two clues meaning different things do not
   come out as the same sentence.

   Nothing here is load-bearing. It is the front page, the doors, the note
   about the books, the footers. A clumsy sentence here is a clumsy sentence;
   it cannot make a case unsolvable. So this file is ordinary prose and is
   checked by reading it.

   WHAT A TRANSLATOR NEEDS TO KNOW

   - `intro` is an array of paragraphs. Keep the count; the page renders one
     <p> per entry. `<b>` and `<i>` may move to wherever the emphasis belongs
     in your language.
   - `{n}` placeholders are filled by the page: {n} counts, {date} a date
     already formatted for your locale, {day} a weekday name likewise.
   - `title` is the name of the game. It IS translated, deliberately — the
     thing is set in Bonn and made as a present, and "The Typing Pool" in the
     middle of a German page reads like an import. Put English back in one
     line if that turns out to be wrong.
   - `locale` drives date formatting through Intl. `name` is what the picker
     shows, and is always written in its OWN language, because a person
     looking for their language is not reading the one currently on screen.

   The German was written first and matters most: the game is a present for a
   German novelist, the setting is her city, and she will read it the way a
   writer reads. It should be gone over by a native speaker before it ships.
   The others are mine too and are held to a lower bar honestly stated: good
   enough to play in, not good enough to be proud of. */

const UI = {

/* ------------------------------------------------------------------ English */
en: {
 name: "English (UK)", locale: "en-GB",
 title: "The Typing Pool",
 sub: "a deduction game · Bonn, 1969 · after five",
 intro: [

  + "it, but the machine that typed it can be read off the page — a chipped "
  + "<i>e<\/i>, a carriage that rides high — so you know exactly which "
  + "typewriter did it. What you do not know is who was sitting at it.",
  "The pool was reorganised. Machines go downstairs to be serviced and come "
  + "back to a different desk; the women get moved along with them. The duty "
  + "roster by the lift is four weeks old and has been corrected in three "
  + "different pencils. So the question is a grid: which machine stood on "
  + "which desk, and who sat there.",
  "It is <b>a quarter past five<\/b>. The typists went home at five — which is "
  + "why you can walk the floors, and why not one of them can simply be "
  + "asked. Everyone else is still in, because clearing up after them is what "
  + "they are for: the charwoman is doing the desks, the night porter is "
  + "signing on, the canteen is between services. They watched that pool all day.",
  "You are <b>Sarah Wessen<\/b>, and you can knock on any door in the "
  + "building. Every call costs you twenty-five minutes, and the last "
  + "collection is at eight.",
  "<b>Schmiss<\/b> comes along for free, and he is the one telling you all "

  + "floors three women came off — and none of those is a name, and all of "
  + "them together are."
 ],
 caption: "Sarah Wessen and Schmiss, as drawn for this game. In the novels he "
  + "is the narrator; here he keeps the job, as far as a crossword will let him.",
 start: "Where to start",
 doors: {
  learn: "Learn it",
  learnSub: "{n} lessons, one idea each, smallest first. Nothing in a lesson "
   + "that the lesson has not taught you.",
  today: "Today's case",
  todaySub: "A new building every morning. Everyone gets the same one.",
  rest: "The rest of them",
  restSub: "{n} cases, from three desks to six, easy to unpleasant."
 },
 daily: {
  today: "Today is {date}.",
  none: "Nobody has built it yet — run daily.py. The link below opens the most "
   + "recent day there is.",
  stale: "Today has not been built yet; the link opens {day}, {date}."
 },
 whose: "Whose dog is this",

  "Wessen and Schmiss are not mine. They belong to the crime novels of "
  + "<b>Gudrun Leyendecker<\/b>, who was born in Bonn in 1948, has been "

 ],

  pages: "pages",
  at: "at the publisher",

/* The front and books pages in English, counting floors from one. A copy of
   `en` for the same reason as in sheet-strings.js: the pages say nothing
   about floors, so there is nothing here to translate — the difference is a
   floor table in phrase.js, and this exists so the choice can be MADE here
   and carried into the sheet, which is where it shows. */
UI["en-NA"] = Object.assign({}, UI.en, {
 name: "English (North America)", locale: "en-CA"});

/* Which language the front and books pages are in. The machinery is in
   lang.js; this file is the prose. Every language here is offered, because
   every one of them is complete — the sheet is the page that has to check. */
function uiLangs(){ return Object.keys(UI); }
function T(){ return UI[UILANG] || UI.en; }
function uiName(l){ return (UI[l] || {}).name || l; }

// the front page's own dates, in its own locale
function pageDate(iso){ return uiDate(iso, T().locale); }
function pageWeekday(iso){ return uiDate(iso, T().locale, {weekday: "long"}); }

/* A language the browser asked for that nobody has written yet falls back to
   English here rather than showing a page of "undefined". */
function uiStart(){ if (!UI[UILANG]) UILANG = "en"; return UILANG; }


const B = JSON.parse(document.getElementById("booksdata").textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* WHAT IS AND IS NOT TRANSLATED HERE.

   The page furniture is: headings, the empty-slot note, the footer, the word
   for a volume. The BOOKS are not. A German novel keeps its German title,
   subtitle and blurb on a French page, the same way the characters keep their
   names — a translated title is a book that does not exist and cannot be
   ordered. `blurb_en` is an English gloss written for readers with no German
   and stays where it is; a reader is better served by the real title plus a
   gloss than by an invention. */
function card(b){
 const t = T().books;
 if (!b.checked){
  return `<div class="book slot"><div class="band">${fill(t.band, {n: b.band})}</div>`
   + `<h3>${t.empty}</h3><p>${t.emptyNote}</p></div>`;
 }
 const facts = [b.publisher, b.published, b.pages ? b.pages + " " + t.pages : null,
                b.binding, b.price, b.edition,
                b.isbn ? "ISBN " + b.isbn : null].filter(Boolean).join(" · ");
 return `<div class="book">`
  + (b.band ? `<div class="band">${fill(t.band, {n: b.band})}</div>` : "")
  + `<h3>${esc(b.title)}</h3>`
  + (b.subtitle ? `<div class="st">${esc(b.subtitle)}</div>` : "")
  + (b.blurb ? `<p>${esc(b.blurb)}</p>` : "")
  /* The English gloss is for readers who have no German. On the German
     page it is the same sentence twice, so it is dropped there and
     kept everywhere else — a French reader is better served by the
     real German blurb plus an English gloss than by neither. */
  + (b.blurb_en && UILANG !== "de" ? `<p class="en">${esc(b.blurb_en)}</p>` : "")
  + `<div class="facts">${esc(facts)}`
  + (b.href ? ` &nbsp;·&nbsp; <a href="${b.href}">${t.at}</a>` : "")
  + `</div></div>`;
}

function redraw(){
 const t = T(), tb = t.books;
 document.documentElement.lang = UILANG;
 document.title = `${B.series.title} — ${t.title}`;
 $("h1").textContent = t.title;
 $("sub").textContent = tb.sub;
 $("back").textContent = tb.back;
 $("findH").textContent = tb.find;
 $("authorH").textContent = tb.author;

 $("lede").innerHTML = `<b>${esc(B.series.title)}.</b> ${tb.seriesBlurb}`;
 $("seriesTitle").textContent = B.series.title;
 $("series").innerHTML = B.series.books
  .slice().sort((x, y) => (x.band || 99) - (y.band || 99)).map(card).join("");

 if (B.also && B.also.books && B.also.books.length){
  $("alsoWrap").hidden = false;
  // translated if the language has it, the file's own English if not
  $("alsoTitle").textContent = T().books.alsoTitle || B.also.title;
  $("alsoNote").textContent = T().books.alsoNote || B.also.note;
  $("also").innerHTML = B.also.books.map(card).join("");
 }

 $("links").innerHTML = B.author.links.map(l =>
  `<a class="link" href="${l.href}"><b>${tb.linkLabels[l.slug] || l.slug}</b>`
  + `<small>${l.kind === "shop" ? tb.shop
     : l.kind === "publisher" ? tb.publisher : tb.aboutHer}</small></a>`).join("");

 /* Her dates in the reader's language and her life in the reader's
    language: both were English sentences inside books.json and both came out
    English on a German page, under a German heading. */
 $("about").textContent = fill(tb.born, {name: B.author.name,
   place: B.author.bornPlace, date: uiDate(B.author.bornDate, T().locale),
   since: B.author.since}) + " " + tb.authorNote;

 $("foot").innerHTML = tb.foot
   + ` &nbsp;·&nbsp; <a href="https://github.com/ApolloEndenich/typing-pool-play/issues" target="_blank" rel="noopener">${T().report}</a>`;

 $("langwrap").innerHTML = "";
 $("langwrap").appendChild(langPicker(uiLangs(), uiName, UILANG, redraw, t.lang));
}

uiSet(uiRecall()); uiStart();
redraw();
</script>
